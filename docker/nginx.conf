# Konfiguracja Nginx jako reverse proxy dla aplikacji Flask

# Definicja upstream dla aplikacji Flask
upstream flask_app {
    server app:5000;
}

# Konfiguracja serwera HTTP
server {
    listen 80;
    server_name localhost;

    # Maksymalny rozmiar body requestu
    client_max_body_size 10M;

    # Logi - zapisywane do wolumenu nginx_logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Główna lokalizacja - proxy do Flask
    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouty
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (opcjonalnie)
    location /health {
        proxy_pass http://flask_app/api/health;
        access_log off;
    }

    # Statyczne pliki (jeśli będą potrzebne w przyszłości)
    location /static {
        alias /app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
